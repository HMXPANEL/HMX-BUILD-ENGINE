plugins {
    id 'com.android.application'
}
android {
    namespace 'com.hbe.test07'
    compileSdk 34
    defaultConfig {
        applicationId "com.hbe.test07"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
