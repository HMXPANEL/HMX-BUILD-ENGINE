    }
}
dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.core:core:1.12.0"
    implementation "com.google.code.gson:gson:2.10.1"\n    implementation "com.google.android.material:material:1.11.0"
}
